# Android Studio bundled JDK path for Windows development.
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr

# Keep Gradle cache outside the project workspace.
systemProp.gradle.user.home=C\:/gradle_cache

# Conservative Gradle settings for repeatable local MVP builds.
org.gradle.vfs.watch=false
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.caching=false

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
